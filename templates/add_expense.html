<!DOCTYPE html>
<html>
<head>

    <title>Add Expense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2>Add Expense</h2>

        <form method="POST">

            <div class="mb-3">
                <label>Date</label>
                <input type="date"
                       name="date"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">

                <label>Category</label>

                <select
                        name="category"
                        class="form-control"
                        required>

                    <option value="">Select Category</option>

                    <option>Food</option>
                    <option>Travel</option>
                    <option>Shopping</option>
                    <option>Bills</option>
                    <option>Health</option>
                    <option>Entertainment</option>
                    <option>Investment</option>
                    <option>EMI</option>
                    <option>Others</option>

                </select>

            </div>

            <div class="mb-3">
                <label>Description</label>
                <input type="text"
                       name="description"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Amount</label>
                <input type="number"
                       step="0.01"
                       name="amount"
                       class="form-control"
                       required>
            </div>

            <button class="btn btn-success">
                Save Expense
            </button>

        </form>

    </div>

</div>

</body>
</html>
