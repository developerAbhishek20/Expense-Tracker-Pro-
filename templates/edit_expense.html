<!DOCTYPE html>
<html>

<head>

    <title>Edit Expense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1>Edit Expense</h1>

        <form method="POST">

            <div class="mb-3">

                <label>Date</label>

                <input
                    type="date"
                    name="date"
                    class="form-control"
                    value="{{ expense[1] }}"
                    required>

            </div>

            <div class="mb-3">

                <label>Category</label>

                <input
                    type="text"
                    name="category"
                    class="form-control"
                    value="{{ expense[2] }}"
                    required>

            </div>

            <div class="mb-3">

                <label>Description</label>

                <input
                    type="text"
                    name="description"
                    class="form-control"
                    value="{{ expense[3] }}"
                    required>

            </div>

            <div class="mb-3">

                <label>Amount</label>

                <input
                    type="number"
                    step="0.01"
                    name="amount"
                    class="form-control"
                    value="{{ expense[4] }}"
                    required>

            </div>

            <button
                class="btn btn-success">

                Update Expense

            </button>

            <a href="/expenses"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

</body>
</html>
