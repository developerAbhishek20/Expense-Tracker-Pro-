<!DOCTYPE html>
<html>

<head>

    <title>Budget Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="mb-4">
            Budget Management
        </h1>

        <form method="POST">

            <div class="mb-3">

                <label>Category</label>

                <select
                    name="category"
                    class="form-control"
                    required>

                    <option>Food</option>
                    <option>Travel</option>
                    <option>Shopping</option>
                    <option>Bills</option>
                    <option>Health</option>
                    <option>Entertainment</option>

                </select>

            </div>

            <div class="mb-3">

                <label>Budget Amount</label>

                <input
                    type="number"
                    step="0.01"
                    name="budget"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-success">

                Save Budget

            </button>

        </form>

        <hr>

        <table class="table table-bordered">

            <thead class="table-dark">

            <tr>

                <th>Category</th>
                <th>Budget</th>

            </tr>

            </thead>

            <tbody>

            {% for row in budgets %}

            <tr>

                <td>{{ row[0] }}</td>
                <td>₹{{ row[1] }}</td>

            </tr>

            {% endfor %}

            </tbody>

        </table>

        <a href="/"
           class="btn btn-primary">

            Home

        </a>

    </div>

</div>

</body>
</html>
