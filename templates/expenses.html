<!DOCTYPE html>
<html>

<head>

    <title>All Expenses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="mb-4">
            All Expenses
        </h1>

        <!-- Search Section -->

        <form method="GET"
              action="/expenses">

            <div class="row">

                <div class="col-md-4">

                    <input
                        type="text"
                        name="search"
                        class="form-control"
                        placeholder="Search Category / Description"
                        value="{{ search }}">

                </div>

                <div class="col-md-3">

                    <input
                        type="date"
                        name="from_date"
                        class="form-control"
                        value="{{ from_date }}">

                </div>

                <div class="col-md-3">

                    <input
                        type="date"
                        name="to_date"
                        class="form-control"
                        value="{{ to_date }}">

                </div>

                <div class="col-md-2">

                    <button
                        class="btn btn-primary w-100">

                        Search

                    </button>

                </div>

            </div>

        </form>

        <hr>

        <!-- Expenses Table -->

        <table class="table table-bordered table-hover">

            <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            {% for expense in expenses %}

            <tr>

                <td>{{ expense[0] }}</td>
                <td>{{ expense[1] }}</td>
                <td>{{ expense[2] }}</td>
                <td>{{ expense[3] }}</td>
                <td>₹{{ expense[4] }}</td>

                <td>

                    <a href="/edit/{{ expense[0] }}"
                       class="btn btn-warning btn-sm">

                        Edit

                    </a>

                    <a href="/delete/{{ expense[0] }}"
                       class="btn btn-danger btn-sm">

                        Delete

                    </a>

                </td>

            </tr>

            {% endfor %}

            </tbody>

        </table>

        <h2>
            Total Spending : ₹{{ total }}
        </h2>

        <br>

        <a href="/"
           class="btn btn-primary">

            Home

        </a>

    </div>

</div>

</body>
</html>
