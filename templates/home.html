<!DOCTYPE html>
<html>

<head>

    <title>Expense Tracker Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-5">
        💰 Expense Tracker Pro
    </h1>

    <div class="row mb-4">

        <div class="col-md-3">
            <div class="card shadow text-center p-3">
                <h2>₹{{ total }}</h2>
                <p>Total Spending</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center p-3">
                <h2>{{ count }}</h2>
                <p>Total Expenses</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center p-3">
                <h2>₹{{ average }}</h2>
                <p>Average Expense</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow text-center p-3">
                <h2>₹{{ highest }}</h2>
                <p>Highest Expense</p>
            </div>
        </div>

    </div>

    <div class="card shadow p-4">

        <h1>Welcome Abhishek Salvi </h1>

        <a href="/add"
           class="btn btn-success mb-2">
            Add Expense
        </a>

        <a href="/expenses"
           class="btn btn-primary mb-2">
            View Expenses
        </a>

        <a href="/summary"
           class="btn btn-warning mb-2">
            Category Summary
        </a>

        <a href="/monthly"
           class="btn btn-info mb-2">
            Monthly Analytics
        </a>

        <a href="/budget"
           class="btn btn-secondary mb-2">
            Budget Management
        </a>

        <a href="/chart"
           class="btn btn-dark mb-2">
            Pie Chart Analytics
        </a>

        <a href="/login"
           class="btn btn-outline-primary mb-2">
            Login
        </a>

        <a href="/register"
           class="btn btn-outline-success mb-2">
            Register
        </a>

        <a href="/logout"
           class="btn btn-outline-danger">
            Logout
        </a>

    </div>

</div>

</body>
</html>
